            constructor(){
                super();
                this.attachShadow({ mode: "open" });
                
                const plantilla = document.getElementById("plantilla-tarjeta");
                this.shadowRoot.appendChild(plantilla.content.cloneNode(true));
                this._rol = this.shadowRoot.querySelector(".rol");
            }

            connectedCallback() {
                this._pintar();
            }
            attributeChangedCallback(atributo, valorViejo, valorNuevo) {
                this._pintar();
            }
            _pintar() {
                this._rolEl.textContent = this.getAttribute("rol") ?? "";
            } 
        }
        
        customElements.define("tarjeta-usuario", TarjetaUsuario);
